function csv(s){let rows=[],row=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&c===','){row.push(v.trim());v=''}else if(!quoted&&c==='\n'){row.push(v.trim());rows.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v.trim());rows.push(row)}return rows}
function minutes(s){let t=String(s).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?$/i);if(!t)throw Error('Invalid time '+s);let h=+t[1],m=+t[2];if(t[3])h=h%12+(t[3].toUpperCase()==='PM'?12:0);if(h>23||m>59)throw Error('Invalid time');return h*60+m}
